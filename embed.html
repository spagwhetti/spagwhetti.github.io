<!DOCTYPE html>
<html>
<head>
  <base target="_parent">
  <style>
    :root {
      --primary: #ffffff;
      --secondary: #000000;
    }
    
    body {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-content: center;
      font-family: Helvetica, sans-serif;
      color: var(--secondary);
      background: var(--primary);
      border: 1px solid var(--secondary);
      box-sizing: border-box;
      padding: 8px;
      margin: 0;
    }

    a {
      color: var(--secondary);
      background: none;
      text-decoration: underline;
    }

    a:hover{
      color: var(--primary);
      background: var(--secondary);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <a id="prev" href="https://spagwhetti.github.io/redirect.html?to=prev">prev</a>
  <a id="header" href="https://spaghetti.nekoweb.org/webring">bolognese webring</a>
  <a id="next" href="https://spagwhetti.github.io/redirect.html?to=next">next</a>
  <script type="text/javascript" src="https://raw.githubusercontent.com/spagwhetti/spagwhetti.github.io/main/webring.js">
</body>
</html>
